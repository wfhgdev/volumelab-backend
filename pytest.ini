[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    postgres: requires an isolated PostgreSQL database and --run-postgres
filterwarnings =
    ignore::DeprecationWarning
    error:Using .*httpx.*starlette.testclient.* is deprecated:starlette.exceptions.StarletteDeprecationWarning
